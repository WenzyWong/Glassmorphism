name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "版本號（例如 1.0.0）"
        required: true

permissions:
  contents: write

jobs:
  release:
    name: Build and publish
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "$VERSION" > VERSION

      - name: Build universal app
        run: ./release.sh "${{ steps.version.outputs.version }}"

      - name: Check architectures
        run: lipo -info dist/Glassmorphism.app/Contents/MacOS/Glassmorphism

      - name: Write release notes
        run: |
          cat > release-notes.md <<'NOTES'
          ## Install

          Download the zip, unpack it, and move `Glassmorphism.app` to `/Applications`.

          The app is ad-hoc signed and **not notarized**, so macOS blocks it on first
          launch. Either right-click the app and choose **Open**, or run:

          ```bash
          xattr -dr com.apple.quarantine /Applications/Glassmorphism.app
          ```

          Universal binary (Apple silicon + Intel). Requires macOS 13 or later.
          NOTES

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          gh release create "v$VERSION" \
            --title "v$VERSION" \
            --notes-file release-notes.md \
            dist/*.zip dist/*.sha256
